<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

</head>

<body>

    <div class="blogpreviewbackground">

      <div class="blogcard">

        <div class="blogimg">
          <img src="./assets/images/illustration-article.svg">
        </div>

        <div class="learningbox">
          <div class="Learningheading">
            <b>Learning</b>
          </div>
        </div>


        <div class="Datebox">
          <div class="Date">
            <p>Published 21 Dec 2023</p> 
          </div>
        </div>


        <div class="Maintextbox">
          <div class="Maintext">
            <h1>HTML & CSS foundations</h1>
          </div>
        </div>

        <div class="Smallmaintextbox">
          <div class="Smallmaintext">
            <p>These Languages are the backbone of every website, defining structure, content, and  presentation.</p>
          </div>
        </div>


        <div class="Profilepicbox">
          <div class="Profilepic">
            <img src="./assets/images/image-avatar.webp">
          </div>
        </div>


        <div class="Namebox">
          <div class="Name">
            <p>Greg Hooper</p>
          </div>
        </div>

        
      </div>




    </div>

    





  









</body>
</html>
